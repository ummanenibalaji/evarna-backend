version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: whisper-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: whisper
      MONGO_INITDB_ROOT_PASSWORD: whisper_dev
      MONGO_INITDB_DATABASE: whisper
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evarna-redis
    restart: unless-stopped
    ports:
      # Published on 6380, not the default 6379, so this does not fight other
      # projects on the same machine for the port. Set REDIS_URL to match.
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
