version: "3.9"

services:
# NOTE: there is deliberately no mongodb service here.
#
# Long-term memory uses Atlas $vectorSearch, which does not exist in a
# self-hosted mongod. A local instance connects, every request succeeds, and
# memory recall silently returns nothing forever — the worst kind of failure.
# Point MONGODB_URI at a real Atlas cluster; the free M0 tier is enough.
# This service used to exist and cost people hours, which is why the comment
# is longer than the config it replaced.

  redis:
    image: redis:7-alpine
    container_name: evarna-redis
    restart: unless-stopped
    ports:
      # Published on 6380, not the default 6379, so this does not fight other
      # projects on the same machine for the port. Set REDIS_URL to match.
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
